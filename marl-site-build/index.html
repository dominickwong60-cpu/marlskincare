<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Required</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0010;
      font-family: 'Courier New', Courier, monospace;
      color: #d0aaff;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(120, 40, 200, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(90, 20, 160, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 56px 48px;
      border: 1px solid rgba(160, 80, 255, 0.25);
      background: rgba(18, 0, 30, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 4px;
      box-shadow:
        0 0 0 1px rgba(120, 40, 200, 0.1),
        0 0 60px rgba(120, 40, 200, 0.12),
        inset 0 1px 0 rgba(200, 140, 255, 0.08);
      width: min(440px, 92vw);
    }

    .blink {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: #a855f7;
      vertical-align: text-bottom;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    h1 {
      font-size: clamp(1rem, 4vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      color: #c084fc;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(168, 85, 247, 0.55);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(160, 80, 255, 0.4), transparent);
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-wrap::before {
      content: '> ';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7c3aed;
      font-size: 0.9rem;
      pointer-events: none;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 14px 14px 36px;
      background: rgba(80, 20, 120, 0.18);
      border: 1px solid rgba(160, 80, 255, 0.3);
      border-radius: 3px;
      color: #e9d5ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      letter-spacing: 0.08em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: #a855f7;
    }

    input[type="password"]::placeholder { color: rgba(160, 80, 255, 0.35); }

    input[type="password"]:focus {
      border-color: rgba(168, 85, 247, 0.7);
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.12), 0 0 20px rgba(168, 85, 247, 0.08);
    }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%);
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 3px;
      color: #ede9fe;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    button:hover {
      background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.3);
    }

    button:active { transform: scale(0.98); }

    #error-msg {
      display: none;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      color: #f87171;
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.4);
      text-align: center;
      text-transform: uppercase;
    }

    #error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ENTER ACCESS CODE<span class="blink"></span></h1>
    <div class="divider"></div>
    <div class="input-wrap">
      <input type="password" id="code" placeholder="········" autocomplete="off" autofocus />
    </div>
    <button id="submit-btn">SUBMIT</button>
    <p id="error-msg">&#9632; ACCESS DENIED</p>
  </div>

  <script>
    const CORRECT = 'hailmarl';
    const TARGET  = 'https://marlskincare.netlify.app';

    function attempt() {
      const val = document.getElementById('code').value;
      const err = document.getElementById('error-msg');
      if (val === CORRECT) {
        window.location.href = TARGET;
      } else {
        err.classList.add('show');
        document.getElementById('code').value = '';
        document.getElementById('code').focus();
      }
    }

    document.getElementById('submit-btn').addEventListener('click', attempt);
    document.getElementById('code').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') attempt();
    });
  </script>
</body>
</html>
